[package]
name = "pack-check"
# Pinned, not inherited: the sibling addon workspace resolves this crate's
# inherited fields against the root workspace, so an inherited version follows
# every game release into that workspace's lockfile.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host-side test support for the bundled mods: indexes every shipped pack's JSON (and the engine's assets) and asserts that each id a mod declares through `mod_sdk::pack_keys!` names a real declaration."

[lints]
workspace = true

[dependencies]
mod-sdk = { workspace = true }
